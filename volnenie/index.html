<style>
  /* Чистый чёрный, системный шрифт Apple (на Android Golos), капсулы без бликов, мягкие длинные переходы. */
  :root {
    --bg: #000;
    --card: #141416;
    --card-2: #1D1D1F;
    --text: #F5F5F7;
    --gray: #86868B;
    --orange: #FF5A1F;
    --teal: #006D77;
    --teal-hi: #3FB8C2;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Golos Text", "Helvetica Neue", Arial, sans-serif;
    --ease: cubic-bezier(.16, 1, .3, 1);       /* мягкий выход, как у Apple */
    --ease-io: cubic-bezier(.45, 0, .2, 1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-font-smoothing: antialiased; letter-spacing: -.012em; }

  /* одно мягкое свечение, медленно дышит и подстраивается под экран */
  .glow { position: fixed; left: 50%; top: 40%; width: 140vmax; height: 140vmax; margin: -70vmax 0 0 -70vmax; pointer-events: none;
    background: radial-gradient(closest-side, rgba(0,109,119,.30), rgba(0,109,119,.08) 45%, transparent 70%);
    transition: transform 2.4s var(--ease), opacity 2.4s var(--ease); animation: drift 14s ease-in-out infinite alternate; }
  .glow.warm { background: radial-gradient(closest-side, rgba(255,90,31,.20), rgba(255,90,31,.05) 45%, transparent 70%); }
  @keyframes drift { from { translate: 0 0; } to { translate: 0 -3vh; } }

  .app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: max(14px, env(safe-area-inset-top)) 22px max(20px, env(safe-area-inset-bottom)); }
  .top { display: flex; align-items: center; gap: 16px; height: 32px; position: relative; z-index: 3; }
  .brand { font-weight: 600; font-size: 15px; letter-spacing: .14em; }
  .progress { flex: 1; display: flex; gap: 4px; }
  .progress i { flex: 1; height: 2px; border-radius: 2px; background: rgba(255,255,255,.14); overflow: hidden; position: relative; }
  .progress i::after { content: ""; position: absolute; inset: 0; background: var(--text); transform: scaleX(0); transform-origin: left; transition: transform 1s var(--ease); }
  .progress i.on::after { transform: scaleX(1); }
  .mute { background: none; border: 0; color: var(--gray); padding: 4px; cursor: pointer; display: grid; place-items: center; transition: color .4s; }
  .mute svg { width: 20px; height: 20px; }

  .stage { flex: 1; position: relative; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 20px; pointer-events: none; visibility: hidden; }
  .screen.active { pointer-events: auto; visibility: visible; }

  /* переходы: старый экран тает и чуть отдаляется, новый проявляется из лёгкой дымки, элементы по очереди */
  .screen.leave { visibility: visible; animation: leave .75s var(--ease-io) both; }
  @keyframes leave { to { opacity: 0; transform: scale(.965); filter: blur(10px); } }
  .screen.enter > * { animation: rise 1.25s var(--ease) both; animation-delay: calc(var(--i, 0) * 90ms + 120ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(1.015); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }

  h1, h2 { font-weight: 700; margin: 0; letter-spacing: -.028em; text-wrap: balance; }
  h1 { font-size: clamp(38px, 11vw, 60px); line-height: 1.04;
    background: linear-gradient(180deg, #FFFFFF 30%, #A9A9AE 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h2 { font-size: clamp(28px, 8vw, 40px); line-height: 1.08; }
  .sub { color: var(--gray); font-size: 17px; font-weight: 400; max-width: 31ch; margin: 0; line-height: 1.47; letter-spacing: -.016em; }

  /* кнопки-капсулы: ровная заливка, без бликов и теней */
  .btn { font: 500 17px/1 var(--font); letter-spacing: -.016em; color: #fff; background: var(--orange); border: 0; border-radius: 980px;
    padding: 17px 30px; min-width: 220px; cursor: pointer; text-decoration: none; display: inline-flex; justify-content: center; align-items: center;
    transition: transform .5s var(--ease), background-color .4s, opacity .4s; }
  .btn:hover { background: #FF6B35; }
  .btn:active { transform: scale(.965); transition-duration: .15s; }
  .btn.glass { background: rgba(255,255,255,.09); color: var(--text);
    -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.18); }
  .btn.glass:hover { background: rgba(255,255,255,.13); }
  .link { background: none; border: 0; color: var(--gray); font: 400 15px var(--font); cursor: pointer; padding: 8px; transition: color .4s; }
  .link:hover { color: var(--text); }
  .link::after { content: " ›"; }

  /* старт */
  .pulse-icon { width: 92px; height: 92px; color: var(--orange); }
  .pulse-icon polyline { stroke-dasharray: 40; stroke-dashoffset: 40; animation: trace 2.4s var(--ease-io) infinite; }
  @keyframes trace { 0% { stroke-dashoffset: 40; opacity: 0; } 15% { opacity: 1; } 60% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }

  /* пульс */
  .tapzone { position: relative; width: 236px; height: 236px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; touch-action: none;
    background: radial-gradient(circle at 50% 35%, #1F1F22, #0E0E10 75%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); transition: transform .6s var(--ease); }
  .tapzone.hit { transform: scale(.975); transition-duration: .12s; }
  .tapzone .num { font-weight: 600; font-size: 70px; letter-spacing: -.04em; font-variant-numeric: tabular-nums; line-height: 1; transition: color .6s; }
  .tapzone .unit { font-size: 14px; color: var(--gray); margin-top: 8px; letter-spacing: 0; }
  .ripple { position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 1.5px rgba(255,90,31,.7); animation: ripple 1.3s var(--ease) forwards; pointer-events: none; }
  @keyframes ripple { from { transform: scale(1); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
  .bar { width: 236px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; background: var(--orange); transform: scaleX(0); transform-origin: left; }

  /* выбор мысли */
  .choices { display: grid; gap: 10px; width: min(100%, 420px); }
  .choice { text-align: left; font: 400 16.5px/1.38 var(--font); letter-spacing: -.014em; color: var(--text); border: 0; border-radius: 18px; padding: 16px 18px; cursor: pointer;
    display: flex; gap: 14px; align-items: center; background: var(--card); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.07);
    transition: transform .5s var(--ease), background-color .4s; }
  .choice:hover { background: var(--card-2); }
  .choice:active { transform: scale(.975); transition-duration: .15s; }
  .choice .e { font-size: 22px; }

  /* мысль, которую ломаем */
  .thought { width: min(100%, 360px); min-height: 156px; border-radius: 24px; padding: 26px 24px; display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 22px; line-height: 1.3; letter-spacing: -.02em; touch-action: pan-y; cursor: grab;
    background: linear-gradient(180deg, rgba(255,90,31,.14), rgba(255,90,31,.05)); box-shadow: inset 0 0 0 .5px rgba(255,90,31,.45); color: #FFC2AA;
    transition: transform .6s var(--ease); }
  .thought.good { background: linear-gradient(180deg, rgba(63,184,194,.28), rgba(0,109,119,.12)); box-shadow: inset 0 0 0 .5px rgba(63,184,194,.75), 0 0 60px rgba(63,184,194,.18); color: #EAFBFC; cursor: default; }
  .thought.dissolve { animation: dissolve .62s var(--ease-io) forwards; }
  @keyframes dissolve {
    0% { filter: none; opacity: 1; transform: none; }
    25% { text-shadow: 2px 0 rgba(0,229,255,.7), -2px 0 rgba(255,42,109,.7); transform: translateX(-3px); }
    50% { text-shadow: -3px 0 rgba(0,229,255,.6), 3px 0 rgba(255,42,109,.6); transform: translateX(3px); filter: blur(2px); }
    100% { opacity: 0; transform: scale(1.06); filter: blur(14px); text-shadow: none; }
  }
  .thought.appear { animation: appear 1.2s var(--ease) both; }
  @keyframes appear { from { opacity: 0; transform: scale(.94); filter: blur(12px); } to { opacity: 1; transform: none; filter: none; } }
  .hint { color: var(--gray); font-size: 15px; margin: 0; }
  .arrow { display: inline-block; animation: nudge 2.4s var(--ease-io) infinite; }
  @keyframes nudge { 0%, 100% { transform: translateX(0); opacity: .5; } 50% { transform: translateX(7px); opacity: 1; } }

  /* дыхание */
  .breath { position: relative; width: 256px; height: 256px; display: grid; place-items: center; touch-action: none; cursor: pointer; }
  .breath svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .breath .track { stroke: rgba(255,255,255,.09); }
  .breath .prog { stroke: var(--teal-hi); transition: stroke-dashoffset 1.4s var(--ease); }
  .orb { width: 104px; height: 104px; border-radius: 50%;
    background: radial-gradient(circle at 38% 30%, #BFF6F9 0%, #57CBD4 26%, #0B7F89 66%, #04434A 100%);
    box-shadow: 0 0 80px rgba(63,184,194,.35); }
  .cue { font-weight: 600; font-size: 26px; letter-spacing: -.02em; min-height: 32px; transition: opacity .6s var(--ease); }
  .cycles { display: flex; gap: 8px; }
  .cycles i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.14); transition: background-color .8s var(--ease); }
  .cycles i.on { background: var(--teal-hi); }

  /* итог */
  .card { width: min(100%, 380px); border-radius: 28px; padding: 28px 24px 24px; text-align: left; background: var(--card);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.09); }
  .card .label { font-size: 13px; font-weight: 600; letter-spacing: .02em; color: var(--orange); }
  .card .big { font-weight: 700; font-size: 32px; line-height: 1.08; letter-spacing: -.03em; margin: 10px 0 14px;
    background: linear-gradient(180deg, #FFFFFF 40%, #B5B5BA 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card p { margin: 0; color: #A1A1A6; font-size: 16px; line-height: 1.45; }
  .card .sig { margin-top: 20px; font-size: 13px; font-weight: 600; letter-spacing: .12em; color: var(--gray); }
  .row { display: grid; gap: 10px; width: min(100%, 380px); }
  .why { width: min(100%, 380px); text-align: left; color: var(--gray); font-size: 14px; line-height: 1.5; }
  .why summary { cursor: pointer; color: var(--text); list-style: none; }
  .why summary::after { content: " ›"; display: inline-block; transition: transform .5s var(--ease); }
  .why[open] summary::after { transform: rotate(90deg); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01s !important; animation-delay: 0s !important; transition-duration: .01s !important; }
  }
</style>
</head>
<body>

<div class="app">

    <button class="mute" id="mute" aria-label="Звук"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path id="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path id="cross" d="M16 9l6 6M22 9l-6 6" hidden/></svg></button>

<script>
/* Все слова, которые видит зритель. Пишет Claude Copirater, утверждает Адам. Пустая строка прячет элемент. */
const TEXT = {
  s0_title: "Тебя вызывают. Что сейчас в голове?",
  s0_sub: "Закрой глаза на несколько секунд. Представь: звучит твоё имя, пора выходить.",
  s0_btn: "Представил. Дальше",
  s1_title: "",
  s1_sub: "Легко приложи два пальца к шее сбоку, не дави. Найди пульс и 15 секунд касайся экрана в такт ударам.",
  s1_hint: "",
  s1_result: "Примерно столько ударов в минуту получилось по твоим нажатиям.",
  s1_short: "Замер прервался. Попробуй ещё раз без пауз.",
  s1_btn: "Дальше",
  s1_again: "Повторить",
  s2_title: "Что из этого звучит у тебя в голове?",
  s3_title_before: "Что скажешь себе перед первым действием?",
  s3_sub_before: "Твоя привычная мысль уже здесь. Нажми на неё, чтобы заменить.",
  s3_hint: "Заменить мысль",
  s3_title_after: "Что скажешь себе перед первым действием?",
  s3_sub_after: "Теперь произнеси это. Не про себя.",
  s3_btn: "К дыханию",
  phrase: "Сейчас сделаю то, к чему готовился.",
  s4_title: "",
  s4_sub: "Вдыхай без усилия, удерживая экран; отпускай на спокойном выдохе. Так три раза.",
  s4_done: "Три цикла позади. Проверять, исчезло ли волнение, сейчас не нужно.",
  s4_btn: "Забрать фразу",
  s5_label: "",
  s5_line: "Пора проверить свою подготовку в деле.",
  s5_cta: "Как ты скажешь это себе перед выходом? Напиши свою фразу в чате.",
  s5_chat: "Написать в чат",
  s5_channel: "К выпускам ADAMS",
  s5_again: "Пройти ещё раз",
  why_title: "Почему это работает",
  why_text: "Сильные спортсмены тоже волнуются, но чаще воспринимают своё волнение как помощь перед стартом. В экспериментах изменение отношения к этому состоянию помогало увереннее встречать нагрузку, а в некоторых задачах улучшало результат. Здесь ты пробуешь заменить привычный прогноз провала словами о том, что собираешься делать."
};

(function () {
  const $ = (id) => document.getElementById(id);
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = TEXT[el.dataset.t] || ""; if (!TEXT[el.dataset.t] && !el.closest(".screen > button, .row")) el.hidden = true; });
  // порядок появления элементов на каждом экране
  document.querySelectorAll(".screen").forEach(s => [...s.children].forEach((c, i) => c.style.setProperty("--i", i)));

  /* ---------- звук: только Click, Glitch, Scroll из пака + финальный райсер с затуханием ---------- */
  let ctx = null, master = null, muted = false; const buf = {};
  const files = ["click", "tap", "select", "glitch", "scroll", "riser"];
  const VOL = { click: .45, tap: .55, select: .45, glitch: .6, scroll: .35, riser: .6 };
  function unlock() {
    if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { return; }
    master = ctx.createGain(); master.gain.value = 1; master.connect(ctx.destination);
    files.forEach(n => fetch("sfx/" + n + ".mp3").then(r => r.arrayBuffer()).then(a => new Promise((ok, no) => ctx.decodeAudioData(a, ok, no))).then(b => { buf[n] = b; }).catch(() => {}));
  }
  function play(n, k = 1) {
    if (muted || !ctx || !buf[n]) return;
    const s = ctx.createBufferSource(), g = ctx.createGain(), t = ctx.currentTime;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(VOL[n] * k, t + 0.006);
    s.buffer = buf[n]; s.connect(g); g.connect(master); s.start(t);
  }

  // дыхание: мягкий шум воздуха, звучит ровно столько, сколько держит палец
  let noise = null, breathNode = null;
  function breathSound(inhale) {
    if (muted || !ctx) return;
    breathStop(0.25);
    if (!noise) { const len = ctx.sampleRate * 8; noise = ctx.createBuffer(1, len, ctx.sampleRate); const d = noise.getChannelData(0); let a = 0, b = 0; for (let i = 0; i < len; i++) { a = a * .7 + (Math.random() * 2 - 1) * .3; b = b * .5 + a * .5; d[i] = b; } }
    const src = ctx.createBufferSource(); src.buffer = noise; src.loop = true;
    const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.Q.value = .6;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2400;
    const g = ctx.createGain(); const t = ctx.currentTime;
    if (inhale) { f.frequency.setValueAtTime(500, t); f.frequency.linearRampToValueAtTime(1300, t + 4); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.4, t + 1.2); }
    else { f.frequency.setValueAtTime(950, t); f.frequency.linearRampToValueAtTime(350, t + 5); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.42, t + .35); g.gain.setTargetAtTime(0, t + .6, 1.3); }
    src.connect(f); f.connect(lp); lp.connect(g); g.connect(master); src.start(t);
    breathNode = { src, g };
  }
  function breathStop(sec = .8) {
    if (!breathNode || !ctx) return; const { src, g } = breathNode; const t = ctx.currentTime;
    try { g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t); g.gain.linearRampToValueAtTime(0, t + sec); src.stop(t + sec + .05); } catch (_) {}
    breathNode = null;
  }

  $("mute").addEventListener("click", () => {
    muted = !muted; $("waves").toggleAttribute("hidden", muted); $("cross").toggleAttribute("hidden", !muted);
    if (master && ctx) master.gain.setTargetAtTime(muted ? 0 : 1, ctx.currentTime, .15);
  });
  document.addEventListener("pointerdown", unlock);

  // мягкое появление элемента, который был скрыт
  const reveal = (el) => { el.hidden = false; el.animate([{ opacity: 0, transform: "translateY(12px)", filter: "blur(6px)" }, { opacity: 1, transform: "none", filter: "blur(0)" }], { duration: 1000, easing: "cubic-bezier(.16,1,.3,1)" }); };
  const vibe = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (_) {} };

  /* ---------- мягкие переходы ---------- */
  const screens = [...document.querySelectorAll(".screen")], dots = [...document.querySelectorAll("#dots i")];
  const GLOW = [[1, 1], [.85, 1], [1.05, .9], [1.15, 1], [.9, 1], [1.25, 1]];
  let step = 0, busy = false;
  function go(n) {
    if (busy || n === step) return; busy = true;
    const from = screens[step], to = screens[n];
    play("scroll");
    from.classList.add("leave"); from.classList.remove("active");
    const g = $("glow"); g.style.transform = "scale(" + GLOW[n][0] + ")"; g.classList.toggle("warm", n === 1 || n === 3);
    setTimeout(() => {
      from.classList.remove("leave");
      to.classList.add("active", "enter");
      setTimeout(() => { to.classList.remove("enter"); busy = false; }, 1250 + to.children.length * 90 + 120);
    }, 520);
    step = n;
    dots.forEach((d, i) => d.classList.toggle("on", i <= n));
    if (n === 1) resetPulse();
    if (n === 4) resetBreath();
    if (n === 5) setTimeout(() => play("riser"), 380);
  }
  document.addEventListener("click", (e) => { const b = e.target.closest("[data-go]"); if (b) { unlock(); play("click"); vibe(10); go(Number(b.dataset.go)); } });

  /* ---------- настоящий пульс: нажатие на каждый удар, 15 секунд ---------- */
  const WINDOW = 15000; let taps = [], pRaf = null, pStart = 0, pDone = false;
  const bpmOf = () => Math.round(60000 * (taps.length - 1) / (taps[taps.length - 1] - taps[0]));
  function resetPulse() {
    taps = []; pDone = false; cancelAnimationFrame(pRaf); pRaf = null;
    $("bpm").textContent = "··"; $("bpm").style.color = ""; $("pbar").style.transform = "scaleX(0)";
    $("pulseNote").textContent = TEXT.s1_hint; $("pulseNext").hidden = true; $("pulseAgain").hidden = true;
  }
  $("tapzone").addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (step !== 1 || pDone) return;
    const now = performance.now();
    if (!taps.length) { pStart = now; pRaf = requestAnimationFrame(tickPulse); }
    taps.push(now); play("tap"); vibe(6);
    const z = $("tapzone"); z.classList.add("hit"); setTimeout(() => z.classList.remove("hit"), 120);
    const r = document.createElement("span"); r.className = "ripple"; z.appendChild(r); setTimeout(() => r.remove(), 1300);
    if (taps.length >= 3) $("bpm").textContent = bpmOf();
  });
  function tickPulse() {
    const k = Math.min(1, (performance.now() - pStart) / WINDOW);
    $("pbar").style.transform = "scaleX(" + k + ")";
    if (k < 1) { pRaf = requestAnimationFrame(tickPulse); return; }
    pRaf = null; pDone = true;
    // замер засчитываем, только если нажимали все 15 секунд без пауз
    const end = pStart + WINDOW, last = taps[taps.length - 1];
    const gaps = taps.slice(1).map((t, i) => t - taps[i]);
    const steady = taps.length >= 6 && end - last < 2500 && Math.max(...gaps) < 2500;
    const bpm = steady ? bpmOf() : 0;
    if (bpm >= 35 && bpm <= 220) {
      $("bpm").textContent = bpm; $("bpm").style.color = "var(--orange)"; $("pulseNote").textContent = TEXT.s1_result;
      reveal($("pulseNext")); play("select"); vibe([15, 50, 15]);
    } else {
      $("bpm").textContent = "··"; $("pulseNote").textContent = TEXT.s1_short;
    }
    setTimeout(() => reveal($("pulseAgain")), 150);
  }
  $("pulseAgain").addEventListener("click", () => { play("click"); resetPulse(); });

  /* ---------- выбор мысли и её замена ---------- */
  const thought = $("thought"); let flipped = false;
  $("choices").addEventListener("click", (e) => {
    const c = e.target.closest(".choice"); if (!c || busy) return;
    unlock(); play("select"); vibe(10);
    flipped = false;
    thought.className = "thought"; thought.style.transform = "";
    thought.textContent = "«" + c.dataset.q.replace(/[.!?]$/, "") + "»";
    $("breakTitle").textContent = TEXT.s3_title_before; $("breakSub").textContent = TEXT.s3_sub_before;
    $("hint").hidden = false; $("toBreath").hidden = true;
    go(3);
  });
  function swapText(el, text) {
    el.animate([{ opacity: 1, filter: "blur(0)" }, { opacity: 0, filter: "blur(6px)" }], { duration: 380, easing: "cubic-bezier(.45,0,.2,1)", fill: "forwards" })
      .onfinish = () => { el.textContent = text; el.animate([{ opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0)" }], { duration: 900, easing: "cubic-bezier(.16,1,.3,1)", fill: "forwards" }); };
  }
  function flip() {
    if (flipped) return; flipped = true;
    play("glitch"); vibe([20, 40, 20]);
    $("glow").classList.remove("warm");
    thought.style.transform = ""; thought.classList.add("dissolve");
    $("hint").animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: "forwards" }).onfinish = () => { $("hint").hidden = true; $("hint").getAnimations().forEach(a => a.cancel()); };
    swapText($("breakTitle"), TEXT.s3_title_after); swapText($("breakSub"), TEXT.s3_sub_after);
    setTimeout(() => {
      thought.className = "thought good appear";
      thought.textContent = TEXT.phrase;
      setTimeout(() => reveal($("toBreath")), 500);
    }, 600);
  }
  let sx = null, dx = 0;
  thought.addEventListener("pointerdown", (e) => { if (flipped) return; sx = e.clientX; dx = 0; thought.style.transition = "none"; try { thought.setPointerCapture(e.pointerId); } catch (_) {} });
  thought.addEventListener("pointermove", (e) => { if (sx === null) return; dx = e.clientX - sx; const m = Math.max(0, dx); thought.style.transform = "translateX(" + m * .9 + "px) rotate(" + m / 30 + "deg)"; thought.style.opacity = String(1 - Math.min(.5, m / 300)); });
  const endSwipe = () => { if (sx === null) return; const m = dx; sx = null; thought.style.transition = ""; thought.style.opacity = ""; if (m > 70 || Math.abs(m) < 6) flip(); else thought.style.transform = ""; };
  thought.addEventListener("pointerup", endSwipe);
  $("hint").addEventListener("click", () => { play("click"); flip(); });
  thought.addEventListener("pointercancel", () => { sx = null; thought.style.transition = ""; thought.style.transform = ""; thought.style.opacity = ""; });

  /* ---------- дыхание за пальцем: зажал = вдох, отпустил = выдох ---------- */
  const orb = $("orb"), bprog = $("bprog"), L = 766.5;
  let inhaling = false, inStart = 0, cycles = 0, scale = 1, vel = 0, raf = null, done = false;
  function resetBreath() {
    inhaling = false; cycles = 0; scale = 1; vel = 0; done = false; breathStop(.3);
    orb.style.transform = "scale(1)"; bprog.style.strokeDashoffset = String(L);
    $("breathSub").textContent = TEXT.s4_sub; $("toFinal").hidden = true;
    [...$("cycles").children].forEach(i => i.classList.remove("on"));
  }
  // пружина без рывков: шар догоняет цель плавно и на вдохе, и на выдохе
  function animate() {
    const target = inhaling ? Math.min(1.85, 1 + (performance.now() - inStart) / 4500 * .85) : 1;
    const kStiff = inhaling ? .012 : .006, damp = .86;
    vel = (vel + (target - scale) * kStiff) * damp; scale += vel;
    orb.style.transform = "scale(" + scale.toFixed(4) + ")";
    if (inhaling || Math.abs(scale - 1) > .002 || Math.abs(vel) > .0005) raf = requestAnimationFrame(animate); else { raf = null; orb.style.transform = "scale(1)"; }
  }
  $("breath").addEventListener("pointerdown", (e) => {
    e.preventDefault(); if (step !== 4 || done || inhaling) return;
    try { $("breath").setPointerCapture(e.pointerId); } catch (_) {}
    inhaling = true; inStart = performance.now();
    breathSound(true); vibe(8);
    if (!raf) raf = requestAnimationFrame(animate);
  });
  function release() {
    if (!inhaling) return; inhaling = false;
    const held = performance.now() - inStart;
    breathSound(false);
    if (!raf) raf = requestAnimationFrame(animate);
    if (held < 1500) return; // слишком короткий вдох не засчитываем
    cycles++; [...$("cycles").children].forEach((i, k) => i.classList.toggle("on", k < cycles));
    bprog.style.strokeDashoffset = String(L * (1 - cycles / 3));
    if (cycles >= 3) {
      done = true;
      setTimeout(() => { swapText($("breathSub"), TEXT.s4_done); }, 2600);
      setTimeout(() => { breathStop(1.2); if (step === 4) reveal($("toFinal")); }, 4200);
    }
  }
  ["pointerup", "pointercancel"].forEach(t => $("breath").addEventListener(t, release));

  $("again").addEventListener("click", () => { play("click"); go(0); });
})();
</script>
</body>
</html>
